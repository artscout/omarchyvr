[package]
name = "pimax-ipd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guided IPD test for the Pimax Dream Air with an in-headset screen (pimax-hud): look straight ahead, countdown, measure with the eye chip, show measured/lens IPD, optionally move the lenses (the one approved IPD command, refused when the measurement looks wrong). --simulate renders the screens to PNG without a headset."

[lib]
name = "pimax_ipd"
path = "src/lib.rs"

[[bin]]
name = "pimax-ipd"
path = "src/main.rs"

[dependencies]
pimax-eye = { path = "../pimax-eye" }
pimax-hud = { path = "../pimax-hud" }
libc = { workspace = true }
