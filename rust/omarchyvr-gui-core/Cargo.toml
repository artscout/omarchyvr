[package]
name = "omarchyvr-gui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core of the Pimax desktop app (no UI): live status, the LESSONS.md preflight rules, the setup checklist and the pimax-device checks with their fixes, safe command building (pkexec, terminals, jobs), tools catalogue, docs tables, onboarding, Autofix."

[dependencies]
flate2 = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
memchr = "2"
regex-lite = "0.1"
serde_json = "1"
omarchyvr-config = { path = "../omarchyvr-config" }
# the Work first run's downloads (what is on disk, the sizes) and the graphics-card check (the AI's pid files)
omarchyvr-ai = { path = "../omarchyvr-ai" }
# the eye start list in use (base or full) for the Eyes card
pimax-eye = { path = "../pimax-eye" }
omarchyvr-doctor = { path = "../omarchyvr-doctor" }
# headset modules, system checks with the fix catalogue, onboarding progress (no device I/O of its own)
pimax-device = { path = "../pimax-device" }
omarchyvr-tools = { path = "../omarchyvr-tools" }
# the Record card (settings, status, start/stop of the recorder)
omarchyvr-record = { path = "../omarchyvr-record" }
omarchyvr-components = { path = "../omarchyvr-components" }
