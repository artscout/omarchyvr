[package]
name = "omarchyvr-slam"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline tools for 6DoF head tracking of the Pimax Dream Air: export the factory calibration in Basalt format (calib + VIO config + Monado SLAM_CONFIG toml), check EuRoC recordings made by the Monado driver (timestamps, rates, camera-IMU overlap), estimate IMU noise from a still segment, camera timing from .pxcam recordings, trajectory error (ATE/RPE, loop closure) against a reference."

[lib]
name = "omarchyvr_slam"
path = "src/lib.rs"

[[bin]]
name = "omarchyvr-slam"
path = "src/main.rs"

[dependencies]
pimax-cam = { path = "../pimax-cam" }
omarchyvr-room = { path = "../omarchyvr-room" }
omarchyvr-config = { path = "../omarchyvr-config" }
