[package]
name = "pimax-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `pimax` command line tool: keepalived, probe, imu, controllers, calib, video-on, logtail, info."

[lib]
name = "pimax_tools"
path = "src/lib.rs"

[[bin]]
name = "pimax"
path = "src/main.rs"

[dependencies]
pimax = { workspace = true }
pimax-proto = { workspace = true, features = ["std"] }
libc = { workspace = true }
log = { workspace = true }
regex-lite = "0.1"
serde_json = "1"
pimax-autod = { path = "../pimax-autod" }
pimax-components = { path = "../pimax-components" }
pimax-record = { path = "../pimax-record" }
pimax-config = { path = "../pimax-config" }

[dev-dependencies]
flate2 = { workspace = true }
libc = { workspace = true }
