[package]
name = "pimax-record"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Records what the headset shows: reads the squashed eye images from Monado's recorder tap (shared memory, never stalls the compositor) and encodes them with ffmpeg (NVENC, x264 fallback) into a fragmented mp4. `pimax record start|stop|status`; a leaf component of pimaxd (docs/RECORD.md)."

[lib]
name = "pimax_record"
path = "src/lib.rs"

[[bin]]
name = "pimax-record"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
pimax-components = { path = "../pimax-components" }
