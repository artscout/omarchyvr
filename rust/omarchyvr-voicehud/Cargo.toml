[package]
name = "omarchyvr-voicehud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live voice-to-text captions in the Pimax Dream Air: a tiny XR_EXTX_overlay OpenXR (Vulkan) client for Monado that shows the transcripts published by omarchyvr-voice (JSON lines on a Unix socket) as a head-locked quad layer, coexisting with the main app and WayVR; offline preview (PNG) and dump modes."

[lib]
name = "omarchyvr_voicehud"
path = "src/lib.rs"

[[bin]]
name = "omarchyvr-voice-hud"
path = "src/main.rs"

[dependencies]
openxr = "0.22"
ash = "0.38"
ab_glyph = "0.2"
serde_json = "1"
libc = { workspace = true }
miniz_oxide = { workspace = true }
