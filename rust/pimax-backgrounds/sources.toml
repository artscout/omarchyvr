# The curated list of VR backgrounds (docs/BACKGROUNDS.md has the licence table).
# provider = polyhaven: ref is the asset id (CC0); commons: ref is the file name on Wikimedia Commons (licence and credit
# are read from the Commons API and must be CC0 / public domain / CC BY / CC BY-SA); url: a direct link whose terms are written here.
# Only equirectangular 2:1 panoramas. Images never go in git: they are downloaded to ~/.local/share/pimax/backgrounds.

