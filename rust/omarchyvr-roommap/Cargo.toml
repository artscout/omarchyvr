[package]
name = "omarchyvr-roommap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent room map for the Dream Air: build a map of the room from a 6DoF session (ORB stereo keyframes in room coordinates), recognise the room in a later session (multi-frame gravity-aware 4-DoF alignment), and write the Monado world offset (the PIMAX_ANCHOR hook) so the world origin and the WayVR windows come back to the same real place without a printed tag."

[lib]
name = "omarchyvr_roommap"
path = "src/lib.rs"

[[bin]]
name = "omarchyvr-roommap"
path = "src/main.rs"

[dependencies]
pimax-cam = { path = "../pimax-cam" }
omarchyvr-room = { path = "../omarchyvr-room" }
omarchyvr-anchor = { path = "../omarchyvr-anchor" }
pimax-ctrltrack = { path = "../pimax-ctrltrack" }
omarchyvr-hud = { path = "../omarchyvr-hud" }
