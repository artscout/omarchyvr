id = "win.ws.goto"
phrases = ["go to workspace {n}", "switch to workspace {n}", "workspace {n}", "show workspace {n}", "take me to workspace {n}", "take me to window {n}", "ve al workspace {n}", "window {n}", "go to window {n}", "switch to window {n}", "show window {n}", "ve a la ventana {n}"]
gloss = "switch to workspace N"
run = ["@win", "ws", "{n}"]
slots = { n = "number" }
safety = "safe"
source = "user request 2026-10-15"

[[intent]]
id = "win.ws.next"
phrases = ["next workspace", "workspace next", "workspace forward", "siguiente workspace", "next window", "siguiente ventana"]
gloss = "the next window (workspace, desktop)"
run = ["@win", "ws_next"]
