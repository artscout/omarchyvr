# pimax-voice intent catalogue: "Pimax <command>" -> one action. The single source of truth for voice commands.
#
# Built into `pimax-voice` (include_str!). User overrides: ~/.config/pimax/voice-intents.toml (same format; see
# docs/VOICE.md): [[intent]] entries with an existing id change that intent (enabled, phrases added), new ids add
# intents, and [wake] / [llm] / [paths] / [backdrop] keys replace the defaults.
#
# Per intent:
#   id       unique name (the LLM fallback may only answer with one of these ids)
#   phrases  what to say after the wake word. Words like "please", "the", "a", "can you" are ignored on both sides.
#            {slot} captures words; its type is in `slots` (number = 1..999, word = one plain word,
#            text = several plain words, name = backdrop name, side = left|right|up|main screen word). Spoken numbers ("ten") count as numbers.
#   run      argv, executed directly (no shell). {slot} and {wayvrctl} / {pimax} are substituted per argument.
#            "@..." = built-in: @preset NAME, @backdrop next|previous|NAME, @passthrough CMD, @captions on|off,
#            @help, @undo, @cancel, @say TEXT, @debug on|off,
#            @desk type TEXT | key NAME | browser | search Q | open SITE | tab Q | dictate (desk.rs).
#   safety   safe | careful | never (the risk column of analysis/research/omarchy-voice-commands.html; vr = ours)
#   source   the row in that HTML ("omarchy#12") or "vr"
#   enabled  only approved intents are enabled (user decision 2026-10-15: every safe row + lock the screen)
#   confirm  dangerous: with voice_confirm = "dangerous" (ai.toml) it asks "say yes" first; with "none" (the
#            default) it runs at once; with "always" every intent asks. Dangerous = lock, close a window/tab,
#            typing or Enter into a terminal (decided at run time for @desk), power / session stop.
#   say      feedback toast after the action
#   output   true: show the command's first output lines as the toast (read-only info)
#   gloss    optional: a few words describing the intent for the voice AI's list (default: the first 3 phrases)

[wake]
# the utterance must START with one of these, after at most 2 filler words the ASR makes from "Pi"/"Hey"/"Ok"
# (hi, hey, ok, pi, b, five, time, by, the ...; see LEAD in command.rs). Primary wake word: "Max" (Parakeet hears
# "Pimax" as "five marks", "time max", "B max"). "Pimax" spellings still work. ASR aliases for command words
# ("war" -> work, "free" -> three, "won" -> one, "sinema" -> cinema) are the ALIASES table in command.rs.
words = ["max", "macs", "maks", "max's", "mars", "marks", "pimax", "pi max", "pie max", "pi macs", "pymax", "pimaks", "pimacs", "pimex", "p max", "pmax", "bimax", "pimax's", "pymacs", "pie macs", "primax"]
# "Pimax" alone: the next utterance within this many seconds is a command
followup_s = 6.0
# a confirmation ("yes") must come within this many seconds
confirm_s = 8.0

[paths]
pimax = "pimax"
wayvrctl = "~/src/target-desk/release/wayvrctl"

[backdrop]
# skybox images: <wayvr home>/config/wayvr/<skybox_dir>/*.dds (named by file stem), after the built-in ones
wayvr_home = "~/src/desk-out/wayvr-home-am"
skybox_dir = "skybox"

[llm]
# fallback when a wake-word utterance matches nothing: "off" | "auto" (ollama on 127.0.0.1:11434 if it answers) |
# "ollama" | "openai" (any OpenAI-compatible endpoint; key from api_key_file or api_key_env, never from this repo)
backend = "auto"
url = ""
model = ""
api_key_file = ""
api_key_env = ""
timeout_s = 6.0

