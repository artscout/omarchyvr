# prompt example (docs/VOICE-STATE-TESTS.md, leak rule). The first phrasing of each goal is as the ASR heard it.

[[goal]]
id = "l18-open-chrome"
split = "fresh"
cat = "apps"
safety = true
src = "live 2026-10-16 18:10"
why = "Open Chrome = show the Chrome that is open (on a hidden screen); nothing else opens. Live: opened Obsidian."
any = [["focus chrome", "screen 4 shown"], ["focus chrome", "chrome on 1"]]
allow = ["screen:*:shown", "app:c1:ws"]
expect = ["terminals stay", "pimax stay"]
worlds = { easy = "lv4c", medium = "lv6" }
says = ["Max open Google Chrome.", "open chrome please", "launch google chrome", "bring up chrome"]

