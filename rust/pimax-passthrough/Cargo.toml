[package]
name = "pimax-passthrough"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Camera passthrough for the Pimax Dream Air: KB4 fisheye undistortion, camera-to-eye fixed-depth reprojection maps, CPU remap, offline renderer, and an OpenXR (Vulkan) passthrough client that lets the Monado compositor's timewarp do the IMU rotation compensation."

[lib]
name = "pimax_passthrough"
path = "src/lib.rs"

[[bin]]
name = "pimax-passthrough"
path = "src/main.rs"

[dependencies]
pimax-cam = { path = "../pimax-cam" }
miniz_oxide = { workspace = true }
libc = { workspace = true }
# Runtime loaded with dlopen (default feature `loaded`): no link-time dependency on libopenxr_loader / libvulkan.
openxr = "0.22"
ash = "0.38"
