[package]
name = "omarchyvr-components"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Pimax stack's component model (docs/RESILIENCE-PLAN.md): the Component trait, the dependency graph, restart policy (budgets, backoff, breaker, flapping), the pure reconcile(), read-only probes, the GPU safety gate, event sources (uevent, pidfd, kernel log, resume) and `omarchyvr-health`."

[lib]
name = "omarchyvr_components"
path = "src/lib.rs"

[[bin]]
name = "omarchyvr-health"
path = "src/bin/omarchyvr-health.rs"

[dependencies]
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
