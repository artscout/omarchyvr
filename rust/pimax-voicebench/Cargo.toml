[package]
name = "pimax-voicebench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU voice latency harness for the VR assistant: Parakeet TDT 0.6B (STT) and Kokoro-82M (TTS) through the sherpa-onnx C API (dlopen), plus the WAV I/O and resampling code the production `vox` will reuse."

[lib]
name = "pimax_voicebench"
path = "src/lib.rs"

[[bin]]
name = "pimax-voicebench"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
libloading = "0.8"

[dev-dependencies]
