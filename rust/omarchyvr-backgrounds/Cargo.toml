[package]
name = "omarchyvr-backgrounds"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VR backgrounds for the Pimax desk: a library of free 360 panoramas (Poly Haven CC0, NASA, ESO, NOIRLab, Wikimedia Commons) downloaded to ~/.local/share/omarchyvr/backgrounds as WayVR skybox textures, with the saved choice shared by the app, voice and the desk start."

[lib]
name = "omarchyvr_backgrounds"
path = "src/lib.rs"

[[bin]]
name = "omarchyvr-backgrounds"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
