[package]
name = "pimax-hud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A small in-headset text panel with a progress bar for the Pimax Dream Air under Monado: an OpenXR (Vulkan) quad layer, head-locked or placed at start, CPU-rendered with the built-in 5x7 font. `Hud::new`, `set_lines`, `set_progress`, `frame`; also renders to PNG without a headset."

[lib]
name = "pimax_hud"
path = "src/lib.rs"

[dependencies]
pimax-lens = { path = "../pimax-lens" }
pimax-lenstest = { path = "../pimax-lenstest" }
openxr = "0.22"
ash = "0.38"
