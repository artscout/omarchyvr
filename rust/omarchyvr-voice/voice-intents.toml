# ------------------------------------------------------------------ window control (user request 2026-10-15)
# Vocabulary: a WINDOW is a workspace is one VR screen (the workspace shown on a Hyprland monitor). A TAB is something
# inside an app: a browser tab (Ctrl+PageUp/PageDown, Ctrl+1..9, Ctrl+T, Ctrl+W as key presses to the focused surface),
# a terminal split (foot, Alacritty, kitty, ghostty: new tab = another terminal beside this one), or a Hyprland group member.
# The default target is what the user LOOKS AT (wayvrctl gaze); no gaze = the focused window / monitor, never an error.
# Safe = focus/switch/cycle/move (reversible, no data lost); careful = closes something, so `confirm = true` (the loader
# refuses a "close" action without it). "close window" closes the workspace (all its apps, the prompt counts them);
# "close this/it/app" closes one app. See analysis/research/omarchy-window-control.md.
