# VR screens: which show, how many, their size and place (written cases; docs/SCREENS.md numbers: 1 main, 2 left,
# 3 right, 4 up, 5 up-left, 6 up-right).

[[goal]]
id = "hide-left-name"
why = "Hide a screen named by its side; its apps stay open."
expect = ["screen 2 hidden", "all stay"]
worlds = { medium = "m4", hard = "h6" }
says = ["hide the left screen", "switch off the screen on the left", "uh close the left one, the screen"]

[[goal]]
id = "hide-up-number-words"
why = "Number words and fillers: hide screen four (the upper one)."
expect = ["screen 4 hidden", "all stay"]
worlds = { medium = "m4", hard = "h6" }
says = ["um can you hide screen number four", "close screen for", "get rid of screen four please"]

[[goal]]
id = "hide-here"
why = "Hide the screen the user looks at (gaze on screen 3 here)."
expect = ["screen 3 hidden", "all stay"]
worlds = { medium = "m4", hard = "h6" }
set = { medium = { gaze = "3:t2" }, hard = { gaze = "3:t3" } }
says = ["close this screen", "hide this screen please"]

[[goal]]
id = "hide-three"
why = "A list of three screens; their apps stay."
expect = ["screen 2 hidden", "screen 3 hidden", "screen 4 hidden", "all stay"]
worlds = { medium = "m4", hard = "h6" }
says = ["hide screens 2, 3 and 4", "close screens two three and four"]

[[goal]]
id = "show-hidden"
why = "Show the screen that was hidden; its app is there again."
expect = ["screen 5 shown", "all stay"]
worlds = { medium = "h6b", hard = "h6" }
says = ["show screen five again", "bring back the upper left screen", "uh I want screen 5 back"]

[[goal]]
id = "add-up"
why = "Add the screen above; nothing moves."
expect = ["screen 4 shown", "all stay"]
worlds = { medium = "m4", hard = "h6c" }
set = { medium = { preset = "work-3" } }
says = ["add a screen up there", "put a screen above"]

[[goal]]
id = "count-2"
why = "Two screens in all."
expect = ["shown =2", "all stay"]
worlds = { medium = "m4", hard = "h6c" }
set = { medium = { preset = "work-1", focus = "t1", gaze = "1:t1" } }
says = ["can we have two screens", "just two screens"]

[[goal]]
id = "count-6"
why = "Six screens: every screen shows."
expect = ["shown 1,2,3,4,5,6", "all stay"]
worlds = { medium = "m6", hard = "h6" }
says = ["six screens please", "show all six screens"]

[[goal]]
id = "one-more"
why = "One screen more than now."
expect = ["shown +1", "all stay"]
worlds = { medium = "m4", hard = "h6c" }
set = { medium = { preset = "work-1" } }
says = ["one more screen", "add another screen"]

[[goal]]
id = "smaller-named"
why = "Screens are locked in Work (user 2026-10-18): safety test, the request changes nothing and is answered with the locked toast. Was: Screen 3 smaller; the others keep their size."
expect = ["nothing", "said screens are locked"]
worlds = { medium = "m4", hard = "h6" }
says = ["make screen 3 smaller", "shrink the right screen", "screen three a bit smaller please"]

[[goal]]
id = "closer-named"
why = "Screens are locked in Work (user 2026-10-18): safety test, the request changes nothing and is answered with the locked toast. Was: Screen 2 closer to the user."
expect = ["nothing", "said screens are locked"]
worlds = { medium = "m4", hard = "h6" }
says = ["bring screen 2 closer", "move the left screen closer to me"]

[[goal]]
id = "scale-2-half"
why = "Screens are locked in Work (user 2026-10-18): safety test, the request changes nothing and is answered with the locked toast. Was: Only screen 2 to half its size."
expect = ["nothing", "said screens are locked"]
worlds = { medium = "m4", hard = "h6" }
says = ["make screen two half the size", "screen 2 half as big"]

[[goal]]
id = "scale-all-double"
why = "Screens are locked in Work (user 2026-10-18): safety test, the request changes nothing and is answered with the locked toast. Was: Every shown screen twice as big."
expect = ["nothing", "said screens are locked"]
worlds = { medium = "m4" , hard = "h6" }
says = ["make all the screens double the size", "make every screen twice as big"]

[[goal]]
id = "scale-all-75"
why = "Screens are locked in Work (user 2026-10-18): safety test, the request changes nothing and is answered with the locked toast. Was: Every shown screen to 75 percent."
expect = ["nothing", "said screens are locked"]
worlds = { medium = "m4", hard = "h6" }
says = ["make all screens 75 percent", "all the screens a quarter smaller"]

[[goal]]
id = "nudge-up"
why = "Screens are locked in Work (user 2026-10-18): safety test, the request changes nothing and is answered with the locked toast. Was: The screen looked at moves up."
expect = ["nothing", "said screens are locked"]
worlds = { medium = "m4", hard = "h6" }
says = ["move the screen up a bit", "raise this screen"]

[[goal]]
id = "goto-3"
why = "Focus screen 3 (the right one)."
expect = ["focus 3", "all stay"]
worlds = { medium = "m4s", hard = "h6" }
says = ["go to screen three", "switch to the right screen", "focus screen number 3"]

[[goal]]
id = "swap-1-2"
why = "The apps of screens 1 and 2 change places; the screens stay where they are."
expect = ["swapped 1 2"]
worlds = { medium = "m4", hard = "h6" }
says = ["swap screens one and two", "swap the main and the left screen"]

[[goal]]
id = "whats-on-2"
cat = "info"
why = "A question: which apps are on screen 2; nothing changes."
expect = ["nothing", "said chrome"]
worlds = { medium = "m4", hard = "h6" }
says = ["what's on screen number two", "which apps are on the left screen"]

[[goal]]
id = "reset-screens"
why = "Screens are locked in Work (user 2026-10-18): safety test, the request changes nothing and is answered with the locked toast. Was: Every screen back in its place in front."
expect = ["nothing", "said screens are locked"]
worlds = { medium = "m4", hard = "h6" }
set = { medium = { geom = { "1" = [2.0, 2.5, 70.0, 20.0] } }, hard = { geom = { "1" = [2.0, 2.5, -80.0, -15.0] } } }
says = ["reset the screens", "put all the screens back where they were"]

# ---------------------------------------------------------------------------------- locked layouts (user 2026-10-18)
# The Work screens never move; a layout is switched by name (omarchyvr desk preset NAME) and "recenter" turns the
# whole layout in front of the user. Screens: 1 main, 2 left, 3 right, 4 up, 5 up-left, 6 up-right.

[[goal]]
id = "layout-work4"
cat = "preset"
why = "The default work layout: main, left, right and up. Nothing closes."
expect = ["preset work-4", "shown 1,2,3,4", "all stay"]
worlds = { medium = "m6", hard = "h6" }
says = ["work four", "switch to work mode", "four screens layout"]

[[goal]]
id = "layout-focus3"
cat = "preset"
why = "The focus layout: main, left and right, smaller and closer. Nothing closes."
expect = ["preset focus-3", "shown 1,2,3", "all stay"]
worlds = { medium = "m4", hard = "h6" }
says = ["focus mode", "focus layout please", "three screens layout"]

[[goal]]
id = "layout-work5"
cat = "preset"
why = "Five screens: main, left, right, up-left and up-right."
expect = ["preset work-5", "shown 1,2,3,5,6", "all stay"]
worlds = { medium = "m6", hard = "h6" }
says = ["five screens layout", "work five", "switch to the work five layout"]

[[goal]]
id = "layout-work6"
cat = "preset"
why = "All six screens (the old assistant layout)."
expect = ["preset work-6", "shown 1,2,3,4,5,6", "all stay"]
worlds = { medium = "m6", hard = "h6" }
says = ["six screens layout", "work six", "all screens layout"]

[[goal]]
id = "recenter"
cat = "preset"
why = "Recenter: the whole layout comes in front of the user (keeps its shape); no app, screen or layout changes."
expect = ["event recenter", "all stay"]
worlds = { medium = "m4", hard = "h6" }
set = { medium = { geom = { "1" = [2.0, 2.5, 70.0, 0.0] } } }
says = ["recenter", "recenter the screens", "bring the screens in front of me"]
