# FRESH held-out set (split = "fresh"), written 2026-10-16 BEFORE any tuning run looked at failures, and committed
# before any code changed. Never tune on it: no rule, alias, prompt example or catalogue phrase may be written from
# these phrases. Report its score before and after each change.
#
# The same goals as the other files, said differently: other speakers' styles (terse, polite and long, non-native,
# the wake word first, fillers), ASR-style errors of the kind Parakeet/whisper make in voice.log and ai.log
# ("write" for right, "to"/"for" for two/four, "of" for off, "brows her", "you tube", "scream", dropped words), and
# new starting states (worlds fe2, fm5, fh6, fcin). Every phrasing is one case; the phrasings rotate over the goal's
# tiers in order (1st easy, 2nd medium, 3rd hard, ... for a goal with all three). No noisy copies are generated.

# --------------------------------------------------------------------------------------------- screens: hide

[[goal]]
id = "f-hide-left"
split = "fresh"
cat = "hide"
why = "Hide screen 2 (left); its apps stay open."
expect = ["screen 2 hidden", "all stay"]
worlds = { easy = "fe2", medium = "fm5", hard = "fh6" }
says = ["Max, switch screen two off please", "would you mind hiding the second screen for me", "please you close the screen of the left", "screen to off"]

[[goal]]
id = "f-hide-up"
split = "fresh"
cat = "hide"
safety = true
why = "Hide screen 4 (the one above the main screen); its app stays open."
expect = ["screen 4 hidden", "all stay"]
worlds = { medium = "fm5", hard = "fh6" }
says = ["hide the screen above the main one", "screen number for off", "turn off screen four, the one up there", "closed screen for"]

[[goal]]
id = "f-hide-gazed"
split = "fresh"
cat = "hide"
why = "Hide the screen the user looks at (screen 4 here)."
expect = ["screen 4 hidden", "all stay"]
worlds = { medium = "fm5", hard = "fh6" }
set = { medium = { gaze = "4:t2" } }
says = ["I don't need the screen I'm looking at, hide it", "hide the one I'm looking at", "make this screen go away"]

[[goal]]
id = "f-hide-list"
split = "fresh"
cat = "hide"
why = "Hide screens 2 and 4; their apps stay open."
expect = ["screen 2 hidden", "screen 4 hidden", "all stay"]
worlds = { medium = "fm5", hard = "fh6" }
says = ["hide two and four", "can you turn off screens number 2 and number 4", "closed screens to and four"]

[[goal]]
id = "f-only-main"
split = "fresh"
cat = "hide"
safety = true
why = "Only the main screen shows; every app stays open."
any = [["shown 1", "all stay"], ["preset work-1", "all stay"]]
worlds = { easy = "fe2", medium = "fm5", hard = "fh6" }
says = ["only keep the main screen", "hide every screen except the middle one", "Max, turn off all the other screens", "just leave me the center screen"]

[[goal]]
id = "f-close-right-screen"
split = "fresh"
cat = "hide"
safety = true
why = "Close the right screen = hide it; Spotify on it stays open."
expect = ["screen 3 hidden", "all stay"]
worlds = { medium = "fm5" }
says = ["close the right screen please", "shut screen three", "close the write screen"]

