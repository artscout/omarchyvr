# Every request heard in a live session on record, as a goal on the desk state (src/statetest.rs).
# Sources: the Work session 2026-10-16 15:49-16:00 (findings: 3 of ~16 right), the earlier sessions of 2026-10-16
# (tests/fixtures/live-2026-10-16*.tsv, ai.log traces). `live` = as the speech-to-text heard it (held-out split
# mostly); `says` = variants written for the test. User rules: "close screen N" HIDES that screen; "close everything"
# hides all but the main one; no app ever closes unless the user names it.

[[goal]]
id = "hide-2"
cat = "hide"
src = "live 2026-10-16 15:52-15:53"
why = "Close screen N = hide that VR screen; its apps stay open (user rule 2026-10-16). Live: asked to close window 1 (2 apps) instead."
expect = ["screen 2 hidden", "all stay"]
worlds = { medium = "m4s", hard = "h6" }
live = [
  "can you close down screen number two.",
  "uh closed screen number two.",
  "yes, Max, can you close screen number two?",
  "it's close at screen number two.",
  "can you close screen number two?",
]
says = ["hide screen 2", "close the left screen", "turn off screen two"]

[[goal]]
id = "hide-3-4"
cat = "hide"
src = "live 2026-10-16 15:51"
why = "Remove / shut down screens 4 and 3 = hide both; their apps stay open. Live: swapped them instead (\"Both screens are empty\")."
expect = ["screen 3 hidden", "screen 4 hidden", "all stay"]
worlds = { medium = "m4s", hard = "h6" }
live = ["can you remove screen number four and three?", "Can you Max can you shut down numbers screens four and three?"]
says = ["close screens three and four", "hide screens 3 and 4"]

[[goal]]
id = "hide-others"
cat = "hide"
src = "live 2026-10-16 15:59"
why = "Close everything = only the main screen shows; every app stays open (user rule 2026-10-16). Live: nothing happened."
any = [["shown 1", "all stay"], ["preset work-1", "all stay"]]
worlds = { medium = "m4", hard = "h6" }
live = ["close everything", "closed everything.", "clot screens", "close the other two screens"]
says = ["close all the screens", "just the main screen please", "hide all the other screens"]

