# The way to the goal counts, not only the end (docs/VOICE-STATE-TESTS.md, "Steps and in-between states").
# `steps` = expectations that must hold one after the other in the worlds the desk went through. Without `steps`,
# the in-between checks still run: "stay" expectations hold all the way, a cancel runs nothing, no app on a missing
# screen, no app closed that the goal does not close. `set` can slow the desk down (launch_delay_reads,
# screen_delay_reads) or change it once the voice code has looked (drift).

[[goal]]
id = "st-hide2-terminal"
cat = "steps"
src = "steps 2026-10-18"
why = "Hide screen 2, then open a terminal; nothing else moves."
expect = ["screen 2 hidden", "opened terminal", "all stay"]
steps = [["screen 2 hidden"], ["opened terminal"]]
worlds = { easy = "e3c", medium = "m4", hard = "h6" }
says = ["hide screen two and then open a terminal", "close screen two, then start a new terminal"]

[[goal]]
id = "st-four-term-left-chrome-right"
cat = "steps"
src = "steps 2026-10-18"
why = "Four screens, then the terminals left, then Chrome right."
expect = ["shown 1,2,3,4", "terminals on 2", "chrome on 3"]
steps = [["shown 1,2,3,4"], ["terminals on 2"], ["chrome on 3"]]
worlds = { easy = "e4", medium = "m4", hard = "h6c" }
set = { easy = { preset = "work-1" }, medium = { preset = "work-1" }, hard = { drop_apps = ["t5"] } }
says = ["four screens, then the terminals on the left and chrome on the right"]

