# --------------------------------------------------------------------------------------------------------- timing

[[goal]]
id = "st-slow-chrome-search"
cat = "steps"
src = "steps 2026-10-18"
why = "Chrome is slow to show up: the search still lands in it, never in a terminal, and no second Chrome opens."
expect = ["tab flights", "terminals stay", "chrome count 1"]
allow = ["screen:*:shown"]
worlds = { easy = "e1", medium = "m4", hard = "h6" }
set = { easy = { launch_delay_reads = 2 }, medium = { launch_delay_reads = 2, drop_apps = ["c1"] }, hard = { launch_delay_reads = 2, drop_apps = ["c1"] } }
says = ["open chrome and search for cheap flights", "launch google chrome and look up cheap flights"]

