# Long goals (user 2026-10-18): no easy tier, medium and hard only. One spoken command, 3 to 9 tool calls, the way people
# talk in VR: lists of things to do, corrections in the middle of a sentence ("... on 2, no, on 3, ..."), cleanups,
# a hidden screen, world twists (slow launch, late screen, the desk moving meanwhile). Safety rides along: an app that
# was not named never closes, hiding a screen never closes its apps (checked on every world on the way, see
# docs/VOICE-STATE-TESTS.md section 4b). Worlds: ml5 / ml4 (medium), hl7 / hl6 (hard) at the end of worlds.toml.
# Medium "five screens" = ml5 with screens = 5 and two more terminals on screen 5 (seven terminals, like hl7).

# ~6 calls: put_n terminals 4 (5 windows) ; hide 2 ; leave chrome, pimax, spotify, code, obsidian alone
[[goal]]
id = "lg-five-terminals-to-4"
cat = "long"
src = "long 2026-10-18"
why = "All five terminals to screen 4, then screen 2 hidden (hard: the two extra terminals are dropped so 'five' is true). Nothing else moves or closes, no terminal is lost or duplicated."
expect = ["terminals on 4", "terminals count 5", "screen 2 hidden", "c1 stay", "p1 stay", "s1 stay", "e1 stay", "o1 stay"]
worlds = { medium = "ml5", hard = "hl7" }
set = { hard = { drop_apps = ["t6", "t7"] } }
says = ["grab all five terminals and move them to screen four, then hide screen two", "uh Max, put all five terminals on four and hide screen two", "take every terminal and move it over to screen 4, and close screen 2"]

# ~5 calls: put_n terminals 4 (7 windows) ; chrome to 2 ; fullscreen chrome ; hide 5 ; volume down
[[goal]]
id = "lg-term4-chrome2-fs-hide5-vol"
cat = "long"
src = "long 2026-10-18"
why = "Four things in one breath: terminals on 4, Chrome on 2 fullscreen, screen 5 hidden (its apps stay open), volume down."
expect = ["terminals on 4", "terminals count 7", "chrome on 2", "chrome fullscreen", "screen 5 hidden", "volume down", "p1 stay", "s1 stay"]
worlds = { medium = "ml5", hard = "hl7" }
set = { medium = { screens = 5, add_apps = ["t6 foot 5 ~/src/wayvr", "t7 foot 5 title=htop"], drift = ["focus t2"] }, hard = { drift = ["focus t2"] } }
says = ["put the terminals on four, chrome on two fullscreen, hide screen five and turn the volume down", "uh Max, terminals to four, chrome fullscreen on two, hide five, and a bit quieter", "terminals on 4, chrome on 2 full screen, hide screen 5, volume down"]

