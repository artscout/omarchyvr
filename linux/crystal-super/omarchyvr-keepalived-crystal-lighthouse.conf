# This PC: Pimax Crystal Super with the Lighthouse faceplate under SteamVR (lighthouse driver + CustomHeadsetOpenVR):
# nothing else switches the panel on, so the keepalive does it, and only while SteamVR runs (`--follow vrserver`):
# otherwise it keeps the headset idle the way Pimax Play does (one keepalive with rate 0, then none: green LED).
# --audio: the headset speakers and microphone are the default audio devices while SteamVR runs.
[Service]
ExecStart=
ExecStart=%h/.local/bin/omarchyvr keepalived --video 90 --follow vrserver --audio
